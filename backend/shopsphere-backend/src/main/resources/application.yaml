spring:
  application:
    name: shopsphere-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/shopsphere
    username: postgres
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: shopsphere-jwt-secret-key-change-this-before-production-2026
  expiration: 900000